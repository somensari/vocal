name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Configure SDK path
        # New Relic stays off unless NEW_RELIC_ENABLED=true and NEW_RELIC_TOKEN are
        # supplied (repo secrets / env). Do not write tokens into committed files.
        # See docs/new-relic.md.
        run: echo "sdk.dir=${ANDROID_SDK_ROOT}" > local.properties
        env:
          NEW_RELIC_ENABLED: ${{ vars.NEW_RELIC_ENABLED }}
          NEW_RELIC_TOKEN: ${{ secrets.NEW_RELIC_TOKEN }}

      - name: Run CI checks
        env:
          NEW_RELIC_ENABLED: ${{ vars.NEW_RELIC_ENABLED || 'false' }}
          NEW_RELIC_APPLICATION_TOKEN: ${{ secrets.NEW_RELIC_APPLICATION_TOKEN }}
        run: ./scripts/ci.sh
        env:
          NEW_RELIC_ENABLED: ${{ vars.NEW_RELIC_ENABLED }}
          NEW_RELIC_TOKEN: ${{ secrets.NEW_RELIC_TOKEN }}
